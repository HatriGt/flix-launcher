name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease -PallowDebugSigning  # test build only; releases are signed locally with the release key
      - uses: actions/upload-artifact@v4
        with:
          name: flix-launcher-apk-debug-signed
          path: app/build/outputs/apk/release/app-release.apk
